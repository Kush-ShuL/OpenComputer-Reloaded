name: Validate API tag

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to validate (leave empty for the selected ref)
        required: false
        type: string
  release:
    types: [published]
permissions:
  contents: read

jobs:
  api:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'api-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate the standalone API build used by JitPack
        run: ./gradlew -p api publishToMavenLocal --console=plain
