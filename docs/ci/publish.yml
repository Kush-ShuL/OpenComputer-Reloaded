name: Publish API package

on:
  workflow_dispatch:
    inputs:
      version:
        description: API package version
        required: true
        type: string
  release:
    types: [published]
permissions:
  contents: read
  packages: write

jobs:
  api:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'api-')
    runs-on: ubuntu-latest
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      API_VERSION: ${{ inputs.version || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Publish independent API with source and Javadoc
        shell: bash
        run: |
          version="${API_VERSION#api-}"
          ./gradlew -Pmod_version="$version" publishApiPublicationToGitHubPackagesRepository --console=plain
