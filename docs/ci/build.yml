name: Java 21 NeoForge build

on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build Java game modules
        run: ./gradlew build --console=plain
      - name: Build the standalone API used by JitPack
        run: ./gradlew -p api publishToMavenLocal --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: OpenComputer-Reloaded-development
          path: |
            build/libs/*.jar
            build/sdk/libs/*.jar
