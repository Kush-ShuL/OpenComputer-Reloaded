plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.144'
}

def portProperties = new Properties()
file('../gradle.properties').withInputStream { portProperties.load(it) }
def jitpackBuild = System.getenv('JITPACK') == 'true'
group = jitpackBuild ? System.getenv('GROUP') : portProperties.mod_group
version = providers.gradleProperty('apiVersion').getOrElse(
        jitpackBuild ? System.getenv('VERSION') : portProperties.api_version)
layout.buildDirectory = file('../build/sdk')

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
    withJavadocJar()
}
repositories { mavenCentral() }
neoForge {
    enable {
        version = portProperties.neo_version
        disableRecompilation = true
    }
}
sourceSets.main {
    java {
        srcDirs = ['../src/main/java']
        include 'li/cil/oc/api/**'
    }
    resources.srcDirs = []
}
dependencies {
    api 'com.typesafe:config:1.4.1'
    compileOnly 'org.jetbrains:annotations:26.0.2'
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet')
}
def legalFiles = files('../LICENSE', '../LICENSE-jnlua', '../LICENSE-luaj', '../LICENSE-mods', '../NOTICE')
tasks.withType(Jar).configureEach {
    from legalFiles
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
tasks.named('jar') {
    manifest { attributes 'Automatic-Module-Name': 'li.cil.oc.api' }
}
publishing {
    publications {
        api(MavenPublication) {
            from components.java
            artifactId = jitpackBuild ? System.getenv('ARTIFACT') : 'opencomputer-reloaded-api'
            pom {
                name = 'OpenComputer-Reloaded API'
                description = 'OpenComputers integration API for Minecraft 1.21.1 NeoForge; compileOnly dependency'
                url = 'https://github.com/Kush-ShuL/OpenComputer-Reloaded'
                licenses {
                    license {
                        name = 'MIT'
                        url = 'https://github.com/Kush-ShuL/OpenComputer-Reloaded/blob/main/LICENSE'
                    }
                }
                scm {
                    url = 'https://github.com/Kush-ShuL/OpenComputer-Reloaded'
                    connection = 'scm:git:https://github.com/Kush-ShuL/OpenComputer-Reloaded.git'
                }
            }
        }
    }
}
