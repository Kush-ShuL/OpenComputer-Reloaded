tasks.register('writeMultiplayerLaunchers') {
    dependsOn prepareMultiplayer, 'prepareTcpServerRun', 'prepareTcpOneRun', 'prepareTcpTwoRun', 'classes'
    doLast {
        for (String actor : ['Server', 'One', 'Two']) {
            def run = tasks.named("runTcp${actor}").get()
            def directory = new File(multiplayerDirectory, actor == 'Server' ? 'server' : "OcTcp${actor}")
            def quote = { Object value -> "'" + value.toString().replace("'", "''") + "'" }
            def command = [run.javaLauncher.get().executablePath.asFile.absolutePath] + run.allJvmArgs +
                    ['-cp', run.classpathProvider.asPath, run.mainClass.get()] + run.args +
                    run.argumentProviders.collectMany { it.asArguments() as List }
            def lines = ["Set-Location -LiteralPath ${quote(directory.absolutePath)}"]
            run.environmentProperty.get().each { key, value -> lines.add('$env:' + key + ' = ' + quote(value)) }
            lines.add('$launchArguments = @(' + command.drop(1).collect(quote).join(',\r\n') + ')')
            lines.add('& ' + quote(command.first()) + ' @launchArguments')
            lines.add('exit $LASTEXITCODE')
            new File(directory, 'launch.ps1').setText(lines.join('\r\n') + '\r\n', 'UTF-8')
        }
    }
}
