def prepareHostPersistenceRun = tasks.register('prepareHostPersistenceRun') {
    outputs.upToDateWhen { false }
    doLast {
        if (!(hostName in ['robot', 'drone', 'tablet', 'microcontroller', 'rack'])) throw new GradleException('ocHost must be robot, drone, tablet, microcontroller or rack')
        if (!providers.gradleProperty('ocHostRunId').isPresent() || !(hostId ==~ /[A-Za-z0-9][A-Za-z0-9._-]{0,63}/))
            throw new GradleException('Supply a new, explicit -PocHostRunId=NAME')
        if (!(hostStage in ['prepare', 'resume'])) throw new GradleException('ocHostStage must be prepare or resume')
        def manifest = new File(hostDirectory, 'checkpoint.properties')
        def world = new File(hostDirectory, 'ocfixture-host-world/level.dat')
        if (hostStage == 'prepare' && (manifest.exists() || world.exists())) throw new GradleException('Existing host worlds/checkpoints are never reset; choose a new run id')
        if (hostStage == 'resume' && !manifest.isFile()) throw new GradleException('Run the matching host prepare stage successfully before resume')
        def settings = new File(hostDirectory, 'config/opencomputers/settings.conf')
        settings.parentFile.mkdirs(); settings.text = fixtureConfiguration('real-host-persistence-fixture')
        def propertiesFile = new File(hostDirectory, 'server.properties')
        if (!propertiesFile.exists()) propertiesFile.setText('''level-name=ocfixture-host-world
level-type=minecraft\\:flat
