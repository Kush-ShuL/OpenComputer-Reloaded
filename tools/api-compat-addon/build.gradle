        new java.util.jar.JarFile(legacyFile).withCloseable { jar ->
            def bytes = jar.getInputStream(jar.getJarEntry('li/cil/oc/api/driver/Converter.class')).withCloseable { it.readAllBytes() }
            if (new String(bytes, java.nio.charset.StandardCharsets.ISO_8859_1).contains('net/minecraft/core/HolderLookup$Provider'))
                throw new GradleException('legacyApiJar already contains the new Converter overload; use a preserved two-argument SDK for the binary-compatibility test')
        }
    }
}
