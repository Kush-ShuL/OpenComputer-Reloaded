    if (providers.gradleProperty('ocMekanismJar').isPresent()) runtimeOnly files(providers.gradleProperty('ocMekanismJar').get())
    if (providers.gradleProperty('ocAppliedEnergisticsJar').isPresent()) runtimeOnly files(providers.gradleProperty('ocAppliedEnergisticsJar').get())
    if (providers.gradleProperty('ocGuideMeJar').isPresent()) runtimeOnly files(providers.gradleProperty('ocGuideMeJar').get())
    if (providers.gradleProperty('ocEnderStorageJar').isPresent()) runtimeOnly files(providers.gradleProperty('ocEnderStorageJar').get())
    if (providers.gradleProperty('ocEnderIOJar').isPresent()) runtimeOnly files(providers.gradleProperty('ocEnderIOJar').get())
    for (String property : ['ocTis3dJar', 'ocMarkdownManualJar', 'ocArchitecturyJar'])
        if (providers.gradleProperty(property).isPresent()) runtimeOnly files(providers.gradleProperty(property).get())
    if (providers.gradleProperty('ocCodeChickenLibJar').isPresent()) runtimeOnly files(providers.gradleProperty('ocCodeChickenLibJar').get())
    if (providers.gradleProperty('ocJadeJar').isPresent()) runtimeOnly files(providers.gradleProperty('ocJadeJar').get())
