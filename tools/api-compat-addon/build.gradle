        def propertiesFile = new File(deviceDirectory, 'server.properties')
        if (!propertiesFile.exists()) propertiesFile.setText('''level-name=ocfixture-device-world
level-type=minecraft\\:flat
online-mode=false
server-ip=127.0.0.1
server-port=25579
gamemode=creative
spawn-protection=0
view-distance=2
simulation-distance=2
enable-command-block=false
''', 'UTF-8')
        def selected = new Properties(); propertiesFile.withInputStream { selected.load(it) }
        if (selected.getProperty('level-name') != 'ocfixture-device-world') throw new GradleException('Refusing a different world name')
        if (providers.gradleProperty('ocCompletionBatchOnly').getOrElse('false') == 'true') {
            selected.setProperty('enable-command-block', 'true')
            propertiesFile.withOutputStream { selected.store(it, null) }
        }
        def eula = new File(deviceDirectory, 'eula.txt')
        def previousEula = file("${repositoryRoot}/build/api-compat-addon/run/eula.txt")
        if (!eula.exists() && previousEula.isFile()) {
