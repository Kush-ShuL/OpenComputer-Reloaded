def fixtureConfiguration = { String version ->
    file("${repositoryRoot}/src/main/resources/application.conf").getText('UTF-8')
            .replaceAll(/registerLuaJArchitecture:\s*false/, 'registerLuaJArchitecture: true')
            .replace('@VERSION@', version) +
            "\n# Isolated fixture selection. Installing the optional mod never enables this bridge.\n" +
            "opencomputers.integration.computerCraft.enabled = ${computerCraftEnabled}\n"
}
layout.buildDirectory = file("${repositoryRoot}/build/api-compat-addon")
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
repositories {
    mavenCentral()
    maven { url = 'https://maven.blamejared.com'; content { includeGroup 'mezz.jei' } }
    maven { url = 'https://www.cursemaven.com'; content { includeModule 'curse.maven', 'forestry-community-edition-1056828' } }
    maven { url = 'https://maven.squiddev.cc' }
    maven { url = 'https://api.modrinth.com/maven'; content { includeModule 'maven.modrinth', 'jade' } }
    maven { url = 'https://api.modrinth.com/maven'; content { includeModule 'maven.modrinth', 'tis3d'; includeModule 'maven.modrinth', 'markdownmanual' } }
