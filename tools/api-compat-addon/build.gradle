        if (selected.getProperty('level-name') != 'ocfixture-host-world') throw new GradleException('Refusing a different Minecraft world')
        def eula = new File(hostDirectory, 'eula.txt')
        def previous = file("${repositoryRoot}/build/api-compat-addon/run/eula.txt")
        if (!eula.exists() && previous.isFile()) {
